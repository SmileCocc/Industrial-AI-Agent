[project]
name = "industrial-ai-agent"
version = "0.1.0"
description = "制造业企业 AI Agent：对接模拟 ERP / MES"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1",
    "cryptography>=43",   # MySQL 8+ caching_sha2_password 认证需要
    "httpx>=0.27",
    "openai>=1.55",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "erp_service*", "mes_service*", "ai_service*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
